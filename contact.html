      background-color: #000000;
    }
    .input-underlined {
      border-bottom: 1px solid rgba(143, 144, 151, 0.4);
      transition: border-color 0.4s ease-in-out;
    }
    .input-underlined:focus {
      border-color: #e9c176;
      outline: none;
    }

<body class="text-on-background font-body selection:bg-secondary/30 bg-black" style="background-color: #000000;">
  <!-- TopAppBar -->
  <nav class="fixed top-0 w-full z-50 backdrop-blur-xl transition-all duration-400 bg-black">
    <div class="flex justify-between items-center px-8 py-6 w-full max-w-7xl mx-auto">
      <div class="font-newsreader text-2xl tracking-widest text-white uppercase">ASHLEY CALZA</div>

      <div class="hidden md:flex items-center gap-10">
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="index.html">HOME</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="about.html">ABOUT</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="media.html">MEDIA</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="gallery.html">GALLERY</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="casting.html">FOR CASTING</a>
        <a class="font-headline tracking-widest uppercase text-white border-b border-white pb-1 hover:scale-105 transition-transform duration-400" href="contact.html">CONTACT</a>
      </div>

      <!-- Mobile Menu Trigger -->
      <button class="md:hidden text-primary" type="button">
        <span class="material-symbols-outlined text-white">menu</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Canvas -->
  <main class="min-h-screen flex items-center justify-center pt-32 pb-32 px-6">
    <div class="w-full max-w-6xl mx-auto">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-24 items-center">
        <!-- Left: Featured Image -->
        <div class="flex justify-center lg:justify-start">
          <div class="relative w-full max-w-md aspect-[2/3] overflow-hidden transition-all duration-700 ease-in-out group">
            <img
              alt="Ashley Calza portrait"
              class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-in-out"
              src="assets/Contact Photo 1.png"
            />
          </div>
        </div>

        <!-- Right: Contact Form -->
        <div>
          <form
            id="contactForm"
            class="space-y-12"
            method="POST"
            target="hidden_iframe"
            novalidate
          >
            <h2 class="text-4xl md:text-5xl font-headline italic mb-12 tracking-tight text-white">Get in Touch!</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-12">
              <div class="relative group">
                <label class="block text-[10px] tracking-[0.2rem] uppercase mb-2 text-white" for="name">Name</label>
                <input
                  class="w-full bg-transparent input-underlined py-4 focus:ring-0 placeholder-on-surface-variant/20 font-light text-white"
                  id="name"
                  name="name"
                  placeholder="YOUR NAME"
                  type="text"
                  maxlength="100"
                  required
                />
              </div>

              <div class="relative group">
                <label class="block text-[10px] tracking-[0.2rem] uppercase mb-2 text-white" for="email">Email</label>
                <input
                  class="w-full bg-transparent input-underlined py-4 focus:ring-0 placeholder-on-surface-variant/20 font-light text-white"
                  id="email"
                  name="email"
                  placeholder="EMAIL@EXAMPLE.COM"
                  type="email"
                  inputmode="email"
                  autocomplete="email"
                  maxlength="254"
                  required
                />
                <p id="emailError" class="hidden text-sm text-error pt-1">Please enter a valid email address.</p>
              </div>
            </div>

            <div class="relative group">
              <label class="block text-[10px] tracking-[0.2rem] uppercase mb-2 text-white" for="subject">Subject</label>
              <input
                class="w-full bg-transparent input-underlined py-4 focus:ring-0 placeholder-on-surface-variant/20 font-light text-white"
                id="subject"
                name="subject"
                placeholder="ENQUIRY TYPE"
                type="text"
                maxlength="150"
                required
              />
            </div>

            <div class="relative group">
              <label class="block text-[10px] tracking-[0.2rem] uppercase mb-2 text-white" for="message">Message</label>
              <textarea
                class="w-full bg-transparent input-underlined py-4 focus:ring-0 placeholder-on-surface-variant/20 font-light resize-none text-white"
                id="message"
                name="message"
                placeholder="TELL ME ABOUT YOUR PROJECT..."
                rows="4"
                maxlength="5000"
                required
              ></textarea>
            </div>

            <!-- Honeypot -->
            <div class="hidden" aria-hidden="true">
              <label for="company">Company</label>
              <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
            </div>

            <div class="pt-4 flex justify-start">
              <button
                id="submitButton"
                class="px-12 py-4 rounded-lg font-bold tracking-widest uppercase text-xs hover:scale-[1.02] active:scale-[0.98] transition-all duration-400 ease-in-out shadow-lg shadow-on-secondary-fixed-variant/10 bg-transparent border border-white text-white hover:bg-white hover:text-black disabled:opacity-60 disabled:cursor-not-allowed"
                type="submit"
              >
                <span id="submitButtonText">Send Message</span>
              </button>
            </div>

            <p id="formError" class="hidden text-sm text-error"></p>
          </form>

          <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-12 border-t border-[#44474d]/20" style="background-color: #000000;">
    <div class="flex justify-center items-center w-full px-8">
      <p class="font-sans text-[10px] tracking-[0.1rem] uppercase text-white"><br></p>
    </div>
  </footer>

  <script>
    // 1) Paste the Apps Script web app URL below
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzinOUrITH-BTxfWTLtUyXZfLhkY86iuKFIPNmjNxeTdTHuyAtZBWqSYnkCOLIedJ7cHw/exec";

    const form = document.getElementById("contactForm");
    const iframe = document.getElementById("hidden_iframe");
    const emailInput = document.getElementById("email");
    const emailError = document.getElementById("emailError");
    const formError = document.getElementById("formError");
    const submitButton = document.getElementById("submitButton");
    const submitButtonText = document.getElementById("submitButtonText");

    let submitted = false;

    // Strict-ish practical email validation
    const emailRegex = /^(?!\.)(?!.*\.\.)([A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*)@([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+)$/;

    function validateEmail() {
      const value = emailInput.value.trim();
      const valid = emailRegex.test(value) && value.length <= 254;
      emailError.classList.toggle("hidden", valid);
      emailInput.setCustomValidity(valid ? "" : "Please enter a valid email address.");
      return valid;
    }

    emailInput.addEventListener("input", validateEmail);
    emailInput.addEventListener("blur", validateEmail);

    form.addEventListener("submit", function (event) {
      formError.classList.add("hidden");
      formError.textContent = "";

      if (!validateEmail()) {
        event.preventDefault();
        return;
      }

      if (!form.checkValidity()) {
        event.preventDefault();
        form.reportValidity();
        return;
      }

      form.action = APPS_SCRIPT_URL;
      submitted = true;
      submitButton.disabled = true;
      submitButtonText.textContent = "Sending...";
    });

    iframe.addEventListener("load", function () {
      if (!submitted) return;
      window.location.href = "contact-success.html";
    });

    window.addEventListener("pageshow", function () {
      submitted = false;
      submitButton.disabled = false;
      submitButtonText.textContent = "Send Message";
    });
  </script>
</body>
</html>
