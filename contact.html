            "on-surface-variant": "#c5c6cd",
            "outline-variant": "#44474d",
            "tertiary-container": "#171919",
            "on-primary-fixed-variant": "#39475f",
            "secondary-fixed": "#ffdea5",
            "inverse-surface": "#e5e2e1",

            "surface-dim": "#131313",
            "surface-bright": "#393939",
            "on-tertiary": "#2f3131",

  <style>

      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .headlines-newsreader { font-family: 'Newsreader', serif; }
    .body-manrope { font-family: 'Manrope', sans-serif; }
  </style>
</head>

<body class="bg-background text-on-surface body-manrope selection:bg-secondary selection:text-on-secondary">
  <nav class="fixed top-0 w-full z-50 bg-neutral-900/70 backdrop-blur-xl transition-all duration-400">
    <div class="flex justify-between items-center px-8 py-6 w-full max-w-screen-2xl mx-auto">
      <div class="text-2xl font-serif italic text-blue-200 dark:text-blue-100">Ashley Calza</div>
      <div class="hidden md:flex items-center gap-10 font-serif text-lg tracking-tight">
        <a class="text-neutral-300 hover:text-blue-100 transition-colors hover:scale-105 duration-400 ease-in-out" href="index.html">Home</a>
        <a class="text-neutral-300 hover:text-blue-100 transition-colors hover:scale-105 duration-400 ease-in-out" href="about.html">About</a>
        <a class="text-neutral-300 hover:text-blue-100 transition-colors hover:scale-105 duration-400 ease-in-out" href="casting.html">Casting</a>
        <a class="text-neutral-300 hover:text-blue-100 transition-colors hover:scale-105 duration-400 ease-in-out" href="gallery.html">Gallery</a>
        <a class="text-amber-200 font-bold border-b border-amber-200/50 pb-1 hover:scale-105 duration-400 ease-in-out" href="contact.html">Contact</a>
      </div>
      <div class="w-24 md:w-32"></div>
    </div>
  </nav>

  <main class="pt-32 pb-20">
    <section class="max-w-screen-xl mx-auto px-8">
      <div class="mb-20 text-center">
        <h1 class="font-headline text-6xl md:text-8xl italic tracking-tighter text-primary leading-none mb-4">Get in Touch</h1>
        <p class="font-body text-on-surface-variant max-w-2xl mx-auto text-lg md:text-xl font-light">
          For performance inquiries, casting opportunities, or collaboration, please reach out via the form below.
        </p>
      </div>

      <div class="max-w-4xl mx-auto">
        <div class="bg-surface-container-low p-10 md:p-14 relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-br from-primary-container/20 to-transparent pointer-events-none"></div>

          <form
            id="contactForm"
            class="relative z-10 space-y-8"
            method="POST"
            target="hidden_iframe"
            novalidate
          >
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div class="space-y-2">
                <label class="font-label text-xs uppercase tracking-widest text-secondary" for="name">Full Name</label>
                <input
                  class="w-full bg-transparent border-0 border-b border-outline/40 focus:ring-0 focus:border-secondary transition-colors py-3 text-on-surface font-body"
                  id="name"
                  name="name"
                  placeholder="Enter your name"
                  type="text"
                  maxlength="100"
                  required
                />
              </div>

              <div class="space-y-2">
                <label class="font-label text-xs uppercase tracking-widest text-secondary" for="email">Email Address</label>
                <input
                  class="w-full bg-transparent border-0 border-b border-outline/40 focus:ring-0 focus:border-secondary transition-colors py-3 text-on-surface font-body"
                  id="email"
                  name="email"
                  placeholder="email@example.com"
                  type="email"
                  inputmode="email"
                  autocomplete="email"
                  maxlength="254"
                  required
                />
                <p id="emailError" class="hidden text-sm text-error pt-1">Please enter a valid email address.</p>
              </div>
            </div>

            <div class="space-y-2">
              <label class="font-label text-xs uppercase tracking-widest text-secondary" for="subject">Subject</label>
              <input
                class="w-full bg-transparent border-0 border-b border-outline/40 focus:ring-0 focus:border-secondary transition-colors py-3 text-on-surface font-body"
                id="subject"
                name="subject"
                placeholder="What are we discussing?"
                type="text"
                maxlength="150"
                required
              />
            </div>

            <div class="space-y-2">
              <label class="font-label text-xs uppercase tracking-widest text-secondary" for="message">Message</label>
              <textarea
                class="w-full bg-transparent border-0 border-b border-outline/40 focus:ring-0 focus:border-secondary transition-colors py-3 text-on-surface font-body resize-none"
                id="message"
                name="message"
                placeholder="Share your message..."
                rows="6"
                maxlength="5000"
                required
              ></textarea>
            </div>

            <!-- Honeypot -->
            <div class="hidden" aria-hidden="true">
              <label for="company">Company</label>
              <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
            </div>

            <div class="pt-4 flex justify-center">
              <button
                id="submitButton"
                class="group flex items-center gap-4 bg-secondary text-on-secondary px-10 py-4 font-bold tracking-widest uppercase hover:scale-[1.02] transition-all duration-400 disabled:opacity-60 disabled:cursor-not-allowed"
                type="submit"
              >
                <span id="submitButtonText">Send Message</span>
                <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">send</span>
              </button>
            </div>

            <p id="formError" class="hidden text-center text-sm text-error"></p>
          </form>

          <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-neutral-950 border-t border-neutral-800/30">
    <div class="flex flex-col md:flex-row justify-between items-center px-12 py-16 w-full max-w-screen-2xl mx-auto">
      <div class="mb-8 md:mb-0">
        <p class="font-sans text-xs tracking-widest uppercase text-neutral-400">© 2026 Ashley Calza. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    // 1) Paste the Apps Script web app URL below
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzinOUrITH-BTxfWTLtUyXZfLhkY86iuKFIPNmjNxeTdTHuyAtZBWqSYnkCOLIedJ7cHw/exec";

    const form = document.getElementById("contactForm");
    const iframe = document.getElementById("hidden_iframe");
    const emailInput = document.getElementById("email");
    const emailError = document.getElementById("emailError");
    const formError = document.getElementById("formError");
    const submitButton = document.getElementById("submitButton");
    const submitButtonText = document.getElementById("submitButtonText");

    let submitted = false;

    // Strict-ish practical email validation
    const emailRegex = /^(?!\.)(?!.*\.\.)([A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*)@([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+)$/;

    function validateEmail() {
      const value = emailInput.value.trim();
      const valid = emailRegex.test(value) && value.length <= 254;
      emailError.classList.toggle("hidden", valid);
      emailInput.setCustomValidity(valid ? "" : "Please enter a valid email address.");
      return valid;
    }

    emailInput.addEventListener("input", validateEmail);
    emailInput.addEventListener("blur", validateEmail);

    form.addEventListener("submit", function (event) {
      formError.classList.add("hidden");
      formError.textContent = "";

      if (!validateEmail()) {
        event.preventDefault();
        return;
      }

      if (!form.checkValidity()) {
        event.preventDefault();
        form.reportValidity();
        return;
      }

      form.action = APPS_SCRIPT_URL;
      submitted = true;
      submitButton.disabled = true;
      submitButtonText.textContent = "Sending...";
    });

    iframe.addEventListener("load", function () {
      if (!submitted) return;
      window.location.href = "contact-success.html";
    });

    window.addEventListener("pageshow", function () {
      submitted = false;
      submitButton.disabled = false;
      submitButtonText.textContent = "Send Message";
    });
  </script>
</body>
</html>
