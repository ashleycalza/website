<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Message Sent | Ashley Calza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#131313",
            surface: "#201f1f",
            primary: "#b9c7e4",
            secondary: "#e9c176",
            "on-surface": "#e5e2e1",
            "on-surface-variant": "#c5c6cd"
          },
          fontFamily: {
            headline: ["Newsreader"],
            body: ["Manrope"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen">
  <main class="min-h-screen flex items-center justify-center px-8">
    <section class="max-w-2xl w-full bg-surface p-10 md:p-14 text-center">
      <h1 class="font-headline text-5xl md:text-7xl italic tracking-tighter text-primary leading-none mb-6">
        Message Sent
      </h1>
      <p class="text-on-surface-variant text-lg md:text-xl font-light mb-10">
        Thank you for reaching out. Your message has been received successfully.
      </p>
      <div class="flex items-center justify-center gap-4 flex-wrap">
        <a href="index.html" class="bg-secondary text-black px-6 py-3 font-bold uppercase tracking-widest">
          Return Home
        </a>
        <a href="contact.html" class="border border-secondary/40 px-6 py-3 uppercase tracking-widest">
          Send Another Message
        </a>
      </div>
    </section>
  </main>
</body>
</html>
