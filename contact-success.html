            "on-tertiary": "#2f3131",
            "background": "#000000",
            "surface-container-highest": "#353534",

            "primary": "#b9c7e4",
            "on-tertiary-container": "#818282",
            "surface-container-high": "#1a1a1a",
            "surface-container-low": "#0a0a0a",
            "secondary-fixed": "#ffdea5",
            "surface-bright": "#1c1c1c",
            "outline": "#8f9097",
            "on-background": "#e5e2e1",
            "on-secondary": "#412d00",
            "inverse-on-surface": "#313030",
            "primary-fixed-dim": "#b9c7e4",
            "tertiary": "#c6c6c6",
            "surface-container": "#121212",

            "on-tertiary-fixed": "#1a1c1c",

            "on-secondary-fixed": "#261900",
            "on-primary-container": "#74829d",
            "error": "#ffb4ab",
            "error-container": "#93000a",
            "secondary": "#e9c176",
            "on-surface-variant": "#c5c6cd",
            "inverse-surface": "#e5e2e1",
            "surface-tint": "#b9c7e4",
            "on-primary": "#233148",
            "primary-container": "#000000",
            "outline-variant": "#44474d",
            "secondary-container": "#604403",
            "on-surface": "#e5e2e1",
            "on-primary-fixed-variant": "#39475f",
            "inverse-primary": "#515f78"
          },
          fontFamily: {
            "headline": ["Newsreader", "serif"],
            "body": ["Manrope", "sans-serif"],
            "label": ["Manrope", "sans-serif"],
            "newsreader": ["Newsreader", "serif"],
            "manrope": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          }
        }
      }
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #000000;
    }
    @media (min-width: 768px) {
      html {
        scrollbar-color: rgba(197, 198, 205, 0.5) #000000;
        scrollbar-width: thin;
      }
      html::-webkit-scrollbar {
        width: 10px;
      }
      html::-webkit-scrollbar-track {
        background: #000000;
      }
      html::-webkit-scrollbar-thumb {
        background: rgba(197, 198, 205, 0.5);
        border-radius: 999px;
        border: 2px solid #000000;
      }
      html::-webkit-scrollbar-thumb:hover {
        background: rgba(197, 198, 205, 0.68);
      }
    }
  </style>
</head>

<body class="bg-background text-on-surface font-body min-h-screen selection:bg-secondary/30">
  <!-- TopAppBar -->
  <nav class="fixed top-0 w-full z-50 backdrop-blur-xl transition-all duration-400 bg-black">
    <div class="flex justify-between items-center px-8 py-6 w-full max-w-7xl mx-auto">
      <div class="font-newsreader text-2xl tracking-widest text-white uppercase">
        ASHLEY CALZA
      </div>

      <div class="hidden md:flex items-center gap-10">
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="index.html">HOME</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="about.html">ABOUT</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="media.html">MEDIA</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="gallery.html">GALLERY</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="casting.html">FOR CASTING</a>
        <a class="font-headline tracking-widest uppercase text-white border-b border-white pb-1 hover:scale-105 transition-transform duration-400" href="contact.html">CONTACT</a>
      </div>

      <button
        aria-controls="mobile-menu"
        aria-expanded="false"
        aria-label="Toggle navigation menu"
        class="md:hidden text-primary"
        data-menu-button
        type="button"
      >
        <span class="material-symbols-outlined text-white">menu</span>
      </button>
    </div>
  </nav>

  <div
    class="md:hidden fixed top-[88px] left-0 right-0 z-[45] hidden border-t border-white/10 bg-[#000000]"
    data-mobile-menu
    id="mobile-menu"
  >
    <div class="flex flex-col gap-6 px-12 py-8">
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="index.html">HOME</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="about.html">ABOUT</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="media.html">MEDIA</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="gallery.html">GALLERY</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="casting.html">FOR CASTING</a>
      <a class="font-headline tracking-widest uppercase text-white border-b border-white pb-1 w-fit" href="contact.html">CONTACT</a>
    </div>
  </div>

  <main class="min-h-screen flex items-center justify-center px-8 pt-32 pb-20">
    <section class="max-w-2xl w-full text-center">
      <div class="border border-white/10 bg-surface-container-low px-8 py-14 md:px-14 md:py-20">
        <div class="flex justify-center mb-8">
          <div class="w-16 h-16 rounded-full border border-white/20 flex items-center justify-center">
            <span class="material-symbols-outlined text-3xl text-white">check</span>
          </div>
        </div>

        <h1 class="font-headline text-4xl md:text-6xl italic tracking-tight text-white mb-6">
          Message Sent
        </h1>

        <p class="text-on-surface-variant text-lg md:text-xl font-light mb-12 max-w-xl mx-auto">
          Thank you for reaching out. Your message has been received successfully.
        </p>

        <div class="flex items-center justify-center gap-4 flex-wrap">
          <a
            href="index.html"
            class="px-10 py-4 rounded-lg font-bold tracking-widest uppercase text-xs transition-all duration-400 ease-in-out border border-white text-white hover:bg-white hover:text-black"
          >
            Return Home
          </a>

          <a
            href="contact.html"
            class="px-10 py-4 rounded-lg font-bold tracking-widest uppercase text-xs transition-all duration-400 ease-in-out border border-white/30 text-white hover:border-white hover:bg-white hover:text-black"
          >
            Send Another Message
          </a>
        </div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const menuButton = document.querySelector("[data-menu-button]");
      const mobileMenu = document.querySelector("[data-mobile-menu]");
      const menuIcon = menuButton?.querySelector(".material-symbols-outlined");

      if (!menuButton || !mobileMenu || !menuIcon) {
        return;
      }

      const closeMenu = () => {
        mobileMenu.classList.add("hidden");
        menuButton.setAttribute("aria-expanded", "false");
        menuIcon.textContent = "menu";
        document.body.classList.remove("overflow-hidden");
      };

      const openMenu = () => {
        mobileMenu.classList.remove("hidden");
        menuButton.setAttribute("aria-expanded", "true");
        menuIcon.textContent = "close";
        document.body.classList.add("overflow-hidden");
      };

      menuButton.addEventListener("click", () => {
        const isOpen = !mobileMenu.classList.contains("hidden");
        if (isOpen) {
          closeMenu();
          return;
        }
        openMenu();
      });

      mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMenu);
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth >= 768) {
          closeMenu();
        }
      });
    })();
  </script>
</body>
</html>
