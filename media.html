  <script>
    (() => {
      const menuButton = document.querySelector("[data-menu-button]");
      const mobileMenu = document.querySelector("[data-mobile-menu]");
      const menuIcon = menuButton?.querySelector(".material-symbols-outlined");

      if (!menuButton || !mobileMenu || !menuIcon) {
        return;
      }

      const closeMenu = () => {
        mobileMenu.classList.add("hidden");
        menuButton.setAttribute("aria-expanded", "false");
        menuIcon.textContent = "menu";
        document.body.classList.remove("overflow-hidden");
      };

      const openMenu = () => {
        mobileMenu.classList.remove("hidden");
        menuButton.setAttribute("aria-expanded", "true");
        menuIcon.textContent = "close";
        document.body.classList.add("overflow-hidden");
      };

      menuButton.addEventListener("click", () => {
        const isOpen = !mobileMenu.classList.contains("hidden");
        if (isOpen) {
          closeMenu();
          return;
        }
        openMenu();
      });

      mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMenu);
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth >= 768) {
          closeMenu();
        }
      });
    })();
  </script>

  <script>
    (() => {
      const useFallbackThumbnail = (thumbnail) => {
        const fallbackSrc = thumbnail.getAttribute("data-thumbnail-fallback");

        if (!fallbackSrc || thumbnail.dataset.thumbnailFallbackApplied === "true") {
          return;
        }

        thumbnail.dataset.thumbnailFallbackApplied = "true";
        thumbnail.src = fallbackSrc;
      };

      document.querySelectorAll("[data-youtube-thumbnail]").forEach((thumbnail) => {
        thumbnail.addEventListener("error", () => {
          useFallbackThumbnail(thumbnail);
        });

        thumbnail.addEventListener("load", () => {
          if (thumbnail.naturalWidth < 300) {
            useFallbackThumbnail(thumbnail);
          }
        });
      });

      const videoEmbeds = document.querySelectorAll("[data-youtube-embed]");

      videoEmbeds.forEach((embed) => {
        const trigger = embed.querySelector("[data-youtube-trigger]");
        const videoId = embed.getAttribute("data-video-id");
        const videoTitle = embed.getAttribute("data-video-title") || "YouTube video";

        if (!trigger || !videoId) {
          return;
        }

        trigger.addEventListener("click", () => {
          const iframe = document.createElement("iframe");
          iframe.className = "absolute inset-0 h-full w-full";
          iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
          iframe.title = videoTitle;
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "strict-origin-when-cross-origin";

          embed.replaceChildren(iframe);
        }, { once: true });
      });
    })();
  </script>
