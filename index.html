<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Ashley Calza | Performer</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#201f1f",
            "inverse-on-surface": "#313030",
            "surface-bright": "#393939",
            "tertiary-container": "#171919",
            "surface-container-low": "#1c1b1b",
            "surface-tint": "#b9c7e4",
            "primary-container": "#000000",
            "on-error-container": "#ffdad6",
            "on-secondary-container": "#dab36a",
            "on-secondary": "#412d00",
            "surface-container-lowest": "#000000",
            "surface-container-high": "#2a2a2a",
            "tertiary-fixed": "#e2e2e2",
            "on-error": "#690005",
            "error-container": "#93000a",
            "primary": "#000000",
            "secondary-fixed": "#ffdea5",
            "on-primary-fixed-variant": "#39475f",
            "on-tertiary-fixed": "#1a1c1c",
            "surface-container-highest": "#353534",
            "surface": "#000000",
            "error": "#ffb4ab",
            "surface-dim": "#000000",
            "secondary-container": "#604403",
            "on-primary-fixed": "#0d1c32",
            "outline-variant": "#44474d",
            "inverse-primary": "#515f78",
            "tertiary-fixed-dim": "#c6c6c6",
            "outline": "#8f9097",
            "secondary": "#e9c176",
            "on-surface": "#ffffff",
            "tertiary": "#c6c6c6",
            "on-tertiary-fixed-variant": "#454747",
            "secondary-fixed-dim": "#e9c176",
            "primary-fixed-dim": "#b9c7e4",
            "primary-fixed": "#d6e3ff",
            "surface-variant": "#353534",
            "on-background": "#ffffff",
            "on-surface-variant": "#c5c6cd",
            "on-secondary-fixed-variant": "#5d4201",
            "on-primary": "#233148",
            "on-tertiary": "#2f3131",
            "inverse-surface": "#e5e2e1",
            "on-tertiary-container": "#818282",
            "on-secondary-fixed": "#261900",
            "background": "#000000",
            "on-primary-container": "#74829d"
          },
          fontFamily: {
            "newsreader": ["Newsreader", "serif"],
            "manrope": ["Manrope", "sans-serif"],
            "headline": ["Newsreader", "serif"],
            "body": ["Manrope", "sans-serif"],
            "label": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
        },
      },
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }

    .text-glow {
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body class="bg-[#000000] text-white font-body selection:bg-secondary selection:text-on-secondary">
  <!-- TopNavBar -->
  <nav class="fixed top-0 w-full z-50 bg-[#000000] flex justify-between items-center px-12 py-6 max-w-full">
    <div class="font-newsreader text-2xl tracking-widest text-[#e5e2e1] uppercase" style="color: rgb(255, 255, 255);">
      ASHLEY CALZA
    </div>

    <!-- Desktop Navigation -->
    <div class="hidden md:flex items-center gap-10">
      <a class="font-headline tracking-widest uppercase text-white border-b border-white pb-1 hover:scale-105 transition-transform duration-400"
         href="index.html"
         style="color: rgb(255, 255, 255); border-color: rgb(255, 255, 255);">
        HOME
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform"
         href="about.html"
         style="color: rgb(255, 255, 255);">
        ABOUT
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform"
         href="media.html"
         style="color: rgb(255, 255, 255);">
        MEDIA
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform"
         href="gallery.html"
         style="color: rgb(255, 255, 255);">
        GALLERY
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform"
         href="casting.html"
         style="color: rgb(255, 255, 255);">
        FOR CASTING
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform"
         href="contact.html"
         style="color: rgb(255, 255, 255);">
        CONTACT
      </a>
    </div>

    <!-- Mobile Menu Toggle (Simplified) -->
    <div class="md:hidden">
      <span class="material-symbols-outlined text-[#e5e2e1]" style="color: rgb(255, 255, 255);">menu</span>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="relative h-screen w-full overflow-hidden flex items-center justify-center">
    <!-- Full-screen background image -->
    <div class="absolute inset-0 z-0">
      <img
        alt="Ashley Calza portrait"
        class="w-full h-full object-cover"
        data-alt="Ashley Calza performing on stage, sitting at a desk with books and writing under dramatic theatrical lighting."
        src="assets/Home Photo 1.png"
      >
      <!-- Soft Overlay Focus / Darker Vignette -->
      <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <!-- Hero Content -->
    <div class="relative z-10 text-center px-6">
      <h1 class="font-manrope text-5xl md:text-8xl font-light tracking-[0.5rem] md:tracking-[1.2rem] text-on-surface uppercase text-glow mb-6" style="color: rgb(255, 255, 255);">
        Ashley Calza
      </h1>

      <div class="flex items-center justify-center gap-4">
        <span class="h-px w-8 bg-secondary/30 hidden md:block"></span>
        <p class="font-manrope text-xs md:text-sm tracking-[0.3rem] font-medium uppercase" style="color: rgb(255, 255, 255);">
          ACTOR-SINGER-DANCER
        </p>
        <span class="h-px w-8 bg-secondary/30 hidden md:block"></span>
      </div>

      <!-- Secondary CTA for mobile or subtle interaction -->
      <div class="mt-12 opacity-0 hover:opacity-100 transition-opacity duration-700">
        <a href="gallery.html" class="bg-secondary text-on-secondary px-8 py-3 rounded text-xs font-bold tracking-widest uppercase hover:scale-105 transition-transform duration-400">
          Enter Portfolio
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#000000] w-full py-10 flex flex-col items-center justify-center">
    <div class="flex gap-8 mb-6"></div>
    <p class="font-manrope text-[10px] uppercase tracking-[0.1rem] text-[#e5e2e1]/50" style="color: rgb(255, 255, 255); opacity: 0.8;"><br></p>
  </footer>
</body>
</html>
