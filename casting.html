<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-secondary-fixed-variant": "#5d4201",
            "on-error-container": "#ffdad6",
            "surface-dim": "#131313",
            "tertiary": "#c6c6c6",
            "on-background": "#e5e2e1",
            "outline": "#8f9097",
            "on-secondary-container": "#dab36a",
            "surface-container-highest": "#353534",
            "primary-fixed": "#d6e3ff",
            "on-primary": "#233148",
            "secondary-container": "#604403",
            "background": "#131313",
            "tertiary-fixed-dim": "#c6c6c6",
            "surface-tint": "#b9c7e4",
            "error-container": "#93000a",
            "surface": "#131313",
            "primary-container": "#0a192f",
            "inverse-surface": "#e5e2e1",
            "on-surface": "#e5e2e1",
            "on-primary-fixed-variant": "#39475f",
            "inverse-on-surface": "#313030",
            "secondary-fixed-dim": "#e9c176",
            "on-tertiary-fixed-variant": "#454747",
            "surface-variant": "#353534",
            "surface-container": "#201f1f",
            "outline-variant": "#44474d",
            "inverse-primary": "#515f78",
            "surface-container-low": "#1c1b1b",
            "on-secondary-fixed": "#261900",
            "primary": "#b9c7e4",
            "on-tertiary-fixed": "#1a1c1c",
            "error": "#ffb4ab",
            "on-tertiary": "#2f3131",
            "on-secondary": "#412d00",
            "secondary-fixed": "#ffdea5",
            "on-primary-fixed": "#0d1c32",
            "surface-bright": "#393939",
            "tertiary-fixed": "#e2e2e2",
            "surface-container-lowest": "#0e0e0e",
            "on-error": "#690005",
            "primary-fixed-dim": "#b9c7e4",
            "on-primary-container": "#74829d",
            "surface-container-high": "#2a2a2a",
            "on-tertiary-container": "#818282",
            "on-surface-variant": "#c5c6cd",
            "tertiary-container": "#171919",
            "secondary": "#e9c176"
          },
          fontFamily: {
            "headline": ["Newsreader", "serif"],
            "body": ["Manrope", "sans-serif"],
            "label": ["Manrope", "sans-serif"],
            "newsreader": ["Newsreader", "serif"],
            "manrope": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #000000;
    }
    @media (min-width: 768px) {
      html {
        scrollbar-color: rgba(197, 198, 205, 0.5) #000000;
        scrollbar-width: thin;
      }
      html::-webkit-scrollbar {
        width: 10px;
      }
      html::-webkit-scrollbar-track {
        background: #000000;
      }
      html::-webkit-scrollbar-thumb {
        background: rgba(197, 198, 205, 0.5);
        border-radius: 999px;
        border: 2px solid #000000;
      }
      html::-webkit-scrollbar-thumb:hover {
        background: rgba(197, 198, 205, 0.68);
      }
    }
  </style>
</head>
<body class="text-on-surface font-body min-h-screen flex flex-col bg-[#000000]">
  <!-- TopNavBar -->
  <nav class="fixed top-0 w-full z-50 bg-[#000000] flex justify-between items-center px-12 py-6 max-w-full">
    <div class="font-newsreader text-2xl tracking-widest text-[#e5e2e1] uppercase" style="color: rgb(255, 255, 255);">
      ASHLEY CALZA
    </div>

    <div class="hidden md:flex items-center gap-10">
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400"
         href="index.html"
         style="color: rgb(255, 255, 255);">
        HOME
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400"
         href="about.html"
         style="color: rgb(255, 255, 255);">
        ABOUT
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400"
         href="media.html"
         style="color: rgb(255, 255, 255);">
        MEDIA
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400"
         href="gallery.html"
         style="color: rgb(255, 255, 255);">
        GALLERY
      </a>

      <a class="font-headline tracking-widest uppercase text-white border-b border-white pb-1 hover:scale-105 transition-transform duration-400"
         href="casting.html"
         style="color: rgb(255, 255, 255); border-color: rgb(255, 255, 255);">
        FOR CASTING
      </a>

      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400"
         href="contact.html"
         style="color: rgb(255, 255, 255);">
        CONTACT
      </a>
    </div>

    <!-- Mobile Menu Toggle -->
    <button
      aria-controls="mobile-menu"
      aria-expanded="false"
      aria-label="Toggle navigation menu"
      class="md:hidden text-[#e5e2e1]"
      data-menu-button
      type="button"
      style="color: rgb(255, 255, 255);"
    >
      <span class="material-symbols-outlined">menu</span>
    </button>
  </nav>

  <div
    class="md:hidden fixed top-[88px] left-0 right-0 z-[45] hidden border-t border-white/10 bg-[#000000]"
    data-mobile-menu
    id="mobile-menu"
  >
    <div class="flex flex-col gap-6 px-12 py-8">
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="index.html">HOME</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="about.html">ABOUT</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="media.html">MEDIA</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="gallery.html">GALLERY</a>
      <a class="font-headline tracking-widest uppercase text-white border-b border-white pb-1 w-fit" href="casting.html">FOR CASTING</a>
      <a class="font-headline tracking-widest uppercase text-white hover:scale-105 transition-transform duration-400 w-fit" href="contact.html">CONTACT</a>
    </div>
  </div>

  <!-- Main Content: Casting Stage -->
  <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-6 md:px-12">
    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-16 items-start">
      <!-- Headshot Section -->
      <div class="flex flex-col items-center group">
        <div class="w-full aspect-[3/4] overflow-hidden bg-surface-container-low rounded shadow-2xl transition-transform duration-500 hover:scale-[1.01]">
          <img alt="Ashley Calza Professional Headshot" class="w-full h-full object-cover" data-alt="striking vertical professional headshot of a female performer with dramatic theatrical lighting and a dark moody background" src="assets/For Casting Photo 1.png">
        </div>
        <div class="w-full mt-4 flex justify-center">
          <a class="font-newsreader text-xl md:text-2xl tracking-wide hover:text-primary transition-colors duration-400 border-b border-secondary/20 hover:border-primary" href="#" style="color: rgb(255, 255, 255); border-color: rgba(255, 255, 255, 0.2);">Headshot</a>
        </div>
      </div>

      <!-- Resume Section -->
      <div class="flex flex-col items-center group">
        <div class="w-full aspect-[3/4] overflow-hidden bg-surface-container-low rounded shadow-2xl transition-transform duration-500 hover:scale-[1.01]">
          <img alt="Ashley Calza Performance Resume" class="w-full h-full object-cover" data-alt="high-quality clean minimalist performance resume on textured white paper with elegant typography and structured layout" src="assets/For Casting Photo 2.png">
        </div>
        <div class="w-full mt-4 flex justify-center">
          <a class="font-newsreader text-xl md:text-2xl tracking-wide hover:text-primary transition-colors duration-400 border-b border-secondary/20 hover:border-primary" href="#" style="color: rgb(255, 255, 255); border-color: rgba(255, 255, 255, 0.2);">Resume</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const menuButton = document.querySelector("[data-menu-button]");
      const mobileMenu = document.querySelector("[data-mobile-menu]");
      const menuIcon = menuButton?.querySelector(".material-symbols-outlined");

      if (!menuButton || !mobileMenu || !menuIcon) {
        return;
      }

      const closeMenu = () => {
        mobileMenu.classList.add("hidden");
        menuButton.setAttribute("aria-expanded", "false");
        menuIcon.textContent = "menu";
        document.body.classList.remove("overflow-hidden");
      };

      const openMenu = () => {
        mobileMenu.classList.remove("hidden");
        menuButton.setAttribute("aria-expanded", "true");
        menuIcon.textContent = "close";
        document.body.classList.add("overflow-hidden");
      };

      menuButton.addEventListener("click", () => {
        const isOpen = !mobileMenu.classList.contains("hidden");
        if (isOpen) {
          closeMenu();
          return;
        }
        openMenu();
      });

      mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMenu);
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth >= 768) {
          closeMenu();
        }
      });
    })();
  </script>
</body>
</html>
