<!DOCTYPE html>
<html class="dark" lang="en">
<head>

            "on-background": "#e5e2e1",
            "outline": "#8f9097",
            "on-secondary-container": "#dab36a",
            "surface-container-highest": "#353534",
            "primary-fixed": "#d6e3ff",
            "on-primary": "#233148",
            "secondary-container": "#604403",
            "background": "#131313",
            "tertiary-fixed-dim": "#c6c6c6",
            "surface-tint": "#b9c7e4",
            "error-container": "#93000a",
            "surface": "#131313",
            "primary-container": "#0a192f",
            "inverse-surface": "#e5e2e1",
            "on-surface": "#e5e2e1",

            "inverse-on-surface": "#313030",
            "secondary-fixed-dim": "#e9c176",
            "on-tertiary-fixed-variant": "#454747",
            "surface-variant": "#353534",

            "outline-variant": "#44474d",
            "inverse-primary": "#515f78",
            "surface-container-low": "#1c1b1b",
            "on-secondary-fixed": "#261900",
            "primary": "#b9c7e4",
            "on-tertiary-fixed": "#1a1c1c",
            "error": "#ffb4ab",
            "on-tertiary": "#2f3131",
            "on-secondary": "#412d00",
            "secondary-fixed": "#ffdea5",
            "on-primary-fixed": "#0d1c32",
            "surface-bright": "#393939",
            "tertiary-fixed": "#e2e2e2",
            "surface-container-lowest": "#0e0e0e",
            "on-error": "#690005",
            "primary-fixed-dim": "#b9c7e4",
            "on-primary-container": "#74829d",
            "surface-container-high": "#2a2a2a",
            "on-tertiary-container": "#818282",
            "on-surface-variant": "#c5c6cd",
            "tertiary-container": "#171919",
            "secondary": "#e9c176"
          },
          fontFamily: {
            "headline": ["Newsreader", "serif"],
            "body": ["Manrope", "sans-serif"],
            "label": ["Manrope", "sans-serif"],
            "newsreader": ["Newsreader", "serif"],
            "manrope": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"

        },

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #000000;
    }
  </style>
</head>
<body class="text-on-surface font-body min-h-screen flex flex-col bg-[#000000]">
  <!-- TopNavBar -->
  <header class="fixed top-0 w-full z-50 bg-black">
    <nav class="flex justify-between items-center px-6 md:px-12 py-6 w-full max-w-screen-2xl mx-auto">
      <div class="font-newsreader text-2xl tracking-widest text-white uppercase">
        ASHLEY CALZA
      </div>

      <!-- Desktop Links -->
      <div class="hidden md:flex items-center gap-10">
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="index.html">HOME</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="about.html">ABOUT</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="media.html">MEDIA</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="gallery.html">GALLERY</a>
        <a class="font-headline tracking-widest uppercase text-white border-b border-white pb-1 hover:text-[#b9c7e4] hover:scale-105 transition-transform transition-colors duration-400" href="casting.html">FOR CASTING</a>
        <a class="font-headline tracking-widest uppercase text-white hover:text-[#b9c7e4] transition-colors duration-400 hover:scale-105 transition-transform" href="contact.html">CONTACT</a>
      </div>

      <!-- Mobile Menu Icon (Visual Only) -->
      <button class="md:hidden text-on-surface" type="button">
        <span class="material-symbols-outlined text-white">menu</span>
      </button>
    </nav>
  </header>

  <!-- Main Content: Casting Stage -->
  <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-6 md:px-12">
    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-16 items-start">
      <!-- Headshot Section -->
      <div class="flex flex-col items-center group">
        <div class="w-full aspect-[3/4] overflow-hidden bg-surface-container-low rounded shadow-2xl transition-transform duration-500 hover:scale-[1.01]">
          <img alt="Ashley Calza Professional Headshot" class="w-full h-full object-cover" data-alt="striking vertical professional headshot of a female performer with dramatic theatrical lighting and a dark moody background" src="assets/For Casting Photo 1.png">
        </div>
        <div class="w-full mt-4 flex justify-center">
          <a class="font-newsreader text-xl md:text-2xl tracking-wide hover:text-primary transition-colors duration-400 border-b border-secondary/20 hover:border-primary" href="#" style="color: rgb(255, 255, 255); border-color: rgba(255, 255, 255, 0.2);">Headshot</a>
        </div>
      </div>

      <!-- Resume Section -->
      <div class="flex flex-col items-center group">
        <div class="w-full aspect-[3/4] overflow-hidden bg-surface-container-low rounded shadow-2xl transition-transform duration-500 hover:scale-[1.01]">
          <img alt="Ashley Calza Performance Resume" class="w-full h-full object-cover" data-alt="high-quality clean minimalist performance resume on textured white paper with elegant typography and structured layout" src="assets/For Casting Photo 2.png">
        </div>
        <div class="w-full mt-4 flex justify-center">
          <a class="font-newsreader text-xl md:text-2xl tracking-wide hover:text-primary transition-colors duration-400 border-b border-secondary/20 hover:border-primary" href="#" style="color: rgb(255, 255, 255); border-color: rgba(255, 255, 255, 0.2);">Resume</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-12 border-t border-[#44474d]/20 bg-black">
    <div class="flex flex-col md:flex-row justify-between items-center px-12 w-full max-w-[1920px] mx-auto gap-6">
      <p class="font-manrope text-[10px] tracking-[0.1rem] uppercase text-[#e5e2e1]/60" style="color: rgb(255, 255, 255);"><br></p>
      <div class="flex space-x-8">
        <a class="font-manrope text-[10px] tracking-[0.1rem] uppercase text-[#e5e2e1]/60 hover:text-[#e9c176] transition-colors" href="#" style="color: rgb(255, 255, 255);"><br></a>
        <a class="font-manrope text-[10px] tracking-[0.1rem] uppercase text-[#e5e2e1]/60 hover:text-[#e9c176] transition-colors" href="#" style="color: rgb(255, 255, 255);"><br></a>
      </div>
    </div>
  </footer>

  <!-- Simple Navigation for Mobile (Bottom Bar) -->
  <div class="md:hidden fixed bottom-0 left-0 w-full border-t border-outline-variant/20 px-6 py-4 flex justify-around items-center z-50 bg-black">
    <span class="material-symbols-outlined text-secondary" style="color: rgb(255, 255, 255);">theater_comedy</span>
    <span class="material-symbols-outlined text-[#e5e2e1]/60" style="color: rgb(255, 255, 255);">person</span>
    <span class="material-symbols-outlined text-[#e5e2e1]/60" style="color: rgb(255, 255, 255);">photo_library</span>
    <span class="material-symbols-outlined text-[#e5e2e1]/60" style="color: rgb(255, 255, 255);">mail</span>
  </div>

</html>
